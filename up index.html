<style>
:root {
  --maroon: #7A1F2B;
  --maroon-bright: #B3303F;
  --white: #FFFFFF;
  --cream: #FFFBF3;
  --ink: #2B1215;
  --muted: #7B5F62;
  --line: #EFE3D0;
  color-scheme: light;
}
* { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
html, body { height: 100%; }
body { margin: 0; background: var(--cream); color: var(--ink); font-size: 16px; line-height: 1.5; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--maroon-bright); outline-offset: 2px; }

.page { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
.chat { width: 100%; max-width: 640px; height: min(700px, calc(100vh - 32px)); display: flex; flex-direction: column; background: var(--white); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px rgba(122, 31, 43, .10); }
.top { background: var(--maroon); color: #FFFFFF; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top strong { font-size: 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; padding: 5px; object-fit: contain; flex-shrink: 0; }
.top span { font-size: 13px; opacity: .9; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--cream); }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; background: var(--white); border: 1px solid var(--line); border-top-left-radius: 2px; }
.msg.user { align-self: flex-end; background: var(--maroon); color: #FFFFFF; border-top-right-radius: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px 0; background: var(--white); }
.chip { border: 1px solid var(--line); background: var(--white); color: var(--maroon); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chip:hover { background: var(--cream); }
.chip:disabled { opacity: .5; cursor: default; }
.composer { display: flex; gap: 8px; padding: 12px 18px 8px; background: var(--white); }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--cream); color: var(--ink); border-radius: 4px; padding: 11px 12px; font-size: 16px; }
.composer input:disabled { opacity: .6; }
.btn { border: 0; border-radius: 4px; padding: 0 18px; font-weight: 700; font-size: 16px; cursor: pointer; background: var(--maroon); color: #FFFFFF; }
.btn:hover { background: var(--maroon-bright); }
.btn:disabled { opacity: .6; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; white-space: normal; }
.act { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; text-decoration: none; color: #FFFFFF; }
.act.wa { background: #1F8F4E; }
.act.wa:hover { background: #18773F; }
.act.maps { background: var(--maroon); }
.act.maps:hover { background: var(--maroon-bright); }
.act { border: 0; cursor: pointer; font-family: inherit; }
.act.yes { background: var(--maroon); }
.act.yes:hover { background: var(--maroon-bright); }
.act.no { background: #FFFFFF; color: var(--maroon); border: 1px solid var(--line); }
.act.no:hover { background: var(--cream); }
</style>
</head>

    </form>

<script>
// ===== GANTI dengan URL /exec Apps Script kamu (Deploy > Manage deployments) =====
var WA_NUMBER = "083152347759";
var WA_URL = "https://wa.me/6283152347759";
var MAPS_URL = "https://share.google/KdFeXNTAPom0m7L9y";
var API_URL ="https://script.google.com/macros/s/AKfycbxsQcOhChwXaMLMCeLWX_5Ue3gKsW7hPpY8oYpMxVCo4sYmrMvdejYiL_rvyZIyL-Ja1g/exec";

(function () {
  var msgs = document.getElementById("msgs");
  var form = document.getElementById("composer");
  var q = document.getElementById("q");
  var sendBtn = document.getElementById("send");
  var chips = document.getElementById("chips");
  var statusEl = document.getElementById("status");
  var busy = false;
  var turns = [];

  function setBusy(on) {
    busy = on;
    q.disabled = on;
    sendBtn.disabled = on;
    Array.prototype.forEach.call(chips.children, function (c) { c.disabled = on; });
  }

  function add(cls, text) {
    var d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  function addButtons(bubble, btns) {
    var box = document.createElement("div");
    box.className = "actions";
    btns.forEach(function (b) {
      var el;
      if (b.href) {
        el = document.createElement("a");
        el.href = b.href;
        el.target = "_blank";
        el.rel = "noopener";
      } else {
        el = document.createElement("button");
        el.type = "button";
        el.addEventListener("click", function () { box.remove(); b.onClick(); });
      }
      el.className = "act " + b.cls;
      el.textContent = b.label;
      box.appendChild(el);
    });
    bubble.appendChild(box);
    msgs.scrollTop = msgs.scrollHeight;
  }

  // Jawaban bot. Tombol Google Maps muncul kalau jawabannya menyebut alamat toko.
  function showReply(bubble, text) {
    bubble.textContent = text;
    if (/rajawali|batu 9|google maps/i.test(text)) {
      addButtons(bubble, [{ cls: "maps", label: "\uD83D\uDCCD Buka Google Maps", href: MAPS_URL }]);
    }
  }

  // Kalau bot tidak bisa menjawab: tanya dulu, mau nomor Admin atau tidak
  function offerAdmin(lang, question) {
    var en = lang === "en";
    var t = {
      ask: en ? "Would you like our Admin's WhatsApp number?" : "Mau aku kasih nomor Admin lewat WhatsApp?",
      yes: en ? "Yes, please" : "Ya, mau",
      no: en ? "No, thanks" : "Tidak",
      gotYes: en ? "Here's our Admin's WhatsApp number: " + WA_NUMBER + ". Tap the button below to chat directly."
                 : "Ini nomor WhatsApp Admin: " + WA_NUMBER + ". Klik tombol di bawah untuk langsung chat ya.",
      gotNo: en ? "Alright! Feel free to ask anything else here." : "Oke! Kalau ada pertanyaan lain, tulis saja di sini ya.",
      btn: en ? "\uD83D\uDCAC Chat Admin on WhatsApp" : "\uD83D\uDCAC Chat Admin di WhatsApp",
      greet: en ? "Hello Admin Sewa Jas, I'd like to ask: " : "Halo Admin Sewa Jas, saya mau tanya: "
    };
    var b = add("bot", t.ask);
    addButtons(b, [
      { cls: "yes", label: t.yes, onClick: function () {
          add("user", t.yes);
          var r = add("bot", t.gotYes);
          var href = WA_URL + (question ? "?text=" + encodeURIComponent(t.greet + question) : "");
          addButtons(r, [{ cls: "wa", label: t.btn, href: href }]);
        } },
      { cls: "no", label: t.no, onClick: function () {
          add("user", t.no);
          add("bot", t.gotNo);
        } }
    ]);
  }

  function done() {
    setBusy(false);
    msgs.scrollTop = msgs.scrollHeight;
    q.focus({ preventScroll: true });
  }

  function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    setBusy(true);
    chips.hidden = true;
    q.value = "";
    add("user", text);
    turns.push({ role: "user", content: text });
    var bubble = add("bot", "Sedang mengetik...");
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 30000);
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // text/plain supaya tidak diblokir browser
      body: JSON.stringify({ messages: turns.slice(-10) }),
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (res) { return res.json(); })
      .then(function (r) {
        if (r && r.reply) {
          showReply(bubble, r.reply);
          turns.push({ role: "assistant", content: r.reply });
          if (r.askAdmin) offerAdmin(r.lang, text);
        } else {
          bubble.textContent = (r && r.error) || "Asisten sedang bermasalah. Coba lagi sebentar lagi.";
          turns.pop();
        }
      })
      .catch(function () {
        bubble.textContent = "Maaf, asisten sedang tidak bisa terhubung. Coba lagi sebentar lagi.";
        turns.pop();
        offerAdmin("id", text);
      })
      .then(function () { clearTimeout(timer); done(); });
  }

  form.addEventListener("submit", function (ev) { ev.preventDefault(); ask(q.value); });
  chips.addEventListener("click", function (ev) {
    var b = ev.target.closest(".chip");
    if (b && !b.disabled) ask(b.textContent);
  });

  statusEl.textContent = "Siap menjawab · v3";
  setBusy(false);
})();
</script>
